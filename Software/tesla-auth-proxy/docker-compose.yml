version: "3.8"

services:
  tesla-auth-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: tesla-auth-proxy:0.1.0
    pull_policy: build
    container_name: tesla-auth-proxy
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      TZ: ${TZ:-Europe/Copenhagen}
      PORT: "8787"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TESLA_AUTH_HOST: ${TESLA_AUTH_HOST:-https://auth.tesla.com}
      TESLA_AUTH_PATH: ${TESLA_AUTH_PATH:-/oauth2/v3}
      TESLA_AUTH_CLIENT_ID: ${TESLA_AUTH_CLIENT_ID:-ownerapi}
      TESLA_AUTH_CLIENT_SECRET: ${TESLA_AUTH_CLIENT_SECRET:-}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
      REFRESH_TOKEN_STORE_PATH: /data/refresh-tokens.json
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8787/healthz')).get('ok') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
